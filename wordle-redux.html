<!DOCTYPE html>
<html>
<head>
    <title>Tony's Wordle</title>
    <style>
    #bigbox { width: 330px; margin: 0 auto; font-size: 24px; }
    .box-container { width: 330px; margin: 0 auto; font-size: 0; }
    .square {
      border: 1px solid #999;
      width: 56px; height: 56px; margin: 5px;
      display: inline-block; vertical-align: top;
      box-sizing: border-box; text-align: center; line-height: 56px;
      font-size: 30px;
      font-family: Gotham, "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #3545c5;
    }
    #letterboard { width: 310px; margin: 20px; text-align: center; }
    .key {
      border: 1px solid; border-radius: 4px;
      width: 18px; height: 35px; margin: 2px;
      display: inline-block; vertical-align: center;
      line-height: 35px; font-size: 14px; box-sizing: border-box;
    }
    .special { width: 45px; font-size: 8px; }
    .correct { background-color: green; }
    .semicorrect { background-color: yellow; }
    .wrong { background-color: gray; }
    </style>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>

    <div id="wordle_container"></div>


    <script>

        var wordle   = "moody";
        var guesses  = ["might", "flood", "stray"];
        var theKeyboard = "qwertyuiopasdfghjkl?zxcvbnm/";


        
        function getStatus(guess, wordle) 
        {
            // builds tally of letter appearance
            var letterCounts = {};
            for (i = 0; i < 5; i++) 
            {
                var ch = wordle[i];
                // add 1 if not yet, add value ch otherwise
                letterCounts[ch] = (letterCounts[ch] || 0) + 1;
            }
            var status = ["wrong", "wrong", "wrong", "wrong", "wrong"];
            var guessArray = guess.split("");
            for (i = 0; i < 5; i++) 
            {
                // gets greens
                if (guessArray[i] === wordle[i]) 
                {
                    status[i] = "correct";
                    letterCounts[guessArray[i]] -= 1;
                }
            }
            


            // yellows
            for (i = 0; i < 5; i++) 
            {
                if (status[i] !== "correct") 
                {
                    var ch = guessArray[i];
                    if (letterCounts[ch] > 0) 
                    {
                        status[i] = "semicorrect";
                        letterCounts[ch] -= 1;
                    }
                }
            }
            return status;
        }


        function wordleGame(withGuesses) 
        {
        // squares key, id and class
            var squares = [];
            for (i = 0; i < 30; i++) 
            {
                squares.push(
                React.createElement("div", {key: "sq" + i, id: "sq"+i, className: "square"}));
            }

        // write the first 15 squares with colored + lettered ones
            if (withGuesses) 
            {
                var keyState = {};
                // number mapper for status comparison
                var priority = { correct: 3, semicorrect: 2, wrong: 1 };
                // iterates through the guess words
                for (g = 0; g < guesses.length; g++) 
                {
                    var squareStatus = getStatus(guesses[g], wordle);
                    var letters= guesses[g].split("");
                    
                    for (i = 0; i < 5; i++) 
                    {
                        var sqIndex = g * 5 + i;
                        squares[sqIndex] = React.createElement("div", 
                        {
                            key: "sq" + sqIndex,
                            id: "sq" + sqIndex,
                            className: "square " + squareStatus[i]
                        }, 
                        letters[i]);

                        var letter = letters[i];
                        var stat = squareStatus[i];

                        var currentBest = keyState[letter];
                        var notYetSeen = !currentBest;
                        var newIsBetter = priority[stat] > priority[currentBest];
                        
                        // update if not seen or if status of letter improves
                        if (notYetSeen || newIsBetter) 
                        {
                            keyState[letter] = stat;
                        }
                    }
                }
            }

            var grid = React.createElement("div", {className: "box-container"}, squares);

        // build rest of letterboard
            var keyElements = [];
            for (var k = 0; k < 28; k++) 
            {
                var letter = theKeyboard[k];

                if (k === 10 || k === 18) 
                {
                    keyElements.push(React.createElement("br", { key: "br" + k }));
                }

                if (k === 19) 
                {
                    keyElements.push(React.createElement("div", 
                    { 
                        key: "k19", id: "k19", className: "key special" 
                    }, 
                    "enter"));
                } 
                else if (k === 27) 
                {
                    keyElements.push(React.createElement("div", 
                    { 
                        key: "k27", id: "k27", className: "key special" 
                    }, 
                    "back"));
                } 
                else 
                {
                    var kClass = "key";
                    // must have state for the key along with the letter to assign color
                    if (withGuesses && keyState && keyState[letter]) 
                    {
                        kClass = "key " + keyState[letter];
                    }
                    keyElements.push(React.createElement("div", 
                    { 
                        key: "k" + k, id: "k" + k, className: kClass 
                    }, 
                    letter));
                }
            }

            var keyboard  = React.createElement("div", {id:"letterboard"}, keyElements);
            var heading   = React.createElement("h1", null, "Tony's Wordle");

            return React.createElement("div", {id: "bigbox"}, heading, grid, keyboard); 
        }

        window.onload = function() {

        var myroot = ReactDOM.createRoot(document.querySelector("#wordle_container"));

        // empty board
        myroot.render(wordleGame(false));

        // guesses
        myroot.render(wordleGame(true));
        }

    </script>

</body>
</html>
